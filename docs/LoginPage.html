<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>House Portal</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-size: cover;
        background-position: center;
        transition: background-image 1s ease-in-out;
    }

    .form-box {
        background: rgba(255, 255, 255, 0.9);
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
        width: 350px;
        text-align: center;
    }

    .form-box h2 {
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    button {
        background-color: #007BFF;
        color: white;
        padding: 10px;
        border: none;
        width: 100%;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }

    .error {
        color: red;
        font-size: 14px;
        margin-top: 5px;
    }

    a {
        color: #007BFF;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    #signupPage { display: none; }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="form-box" id="loginPage">
    <h2>House Portal Login</h2>
    <div id="signupFirstError" class="error"></div>
    <input type="text" id="loginEmail" placeholder="Enter your Email">
    <div id="loginEmailError" class="error"></div>
    <input type="password" id="loginPassword" placeholder="Enter your Password">
    <div id="loginPasswordError" class="error"></div>
    <button onclick="validateLogin()">Login</button>
    <p>Don't have an account? <a href="#" onclick="showSignup()">Sign up</a></p>
</div>

<!-- SIGNUP PAGE -->
<div class="form-box" id="signupPage">
    <h2>Sign Up</h2>
    <div id="alreadySignupError" class="error"></div>
    <input type="text" id="signupEmail" placeholder="Enter your Email">
    <div id="signupEmailError" class="error"></div>
    <input type="password" id="signupPassword" placeholder="Enter your Password">
    <div id="signupPasswordError" class="error"></div>
    <input type="password" id="signupRePassword" placeholder="Re-enter Password">
    <div id="signupRePasswordError" class="error"></div>
    <button onclick="validateSignup()">Sign Up</button>
    <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
</div>

<script>
    // Background images
    const backgrounds = [
        "url('https://images.unsplash.com/photo-1560448204-e02f11c3d0e2')",
        "url('https://images.unsplash.com/photo-1570129477492-45c003edd2be')",
        "url('https://cdn-2.reimaginehome.ai/dev/media/Exterior-Sample-bdefaaf7-3f9c-415b-8e70-eb448b0d85ea.jpeg')"
    ];
    let bgIndex = 0;

    function changeBackground() {
        document.body.style.backgroundImage = backgrounds[bgIndex];
        bgIndex = (bgIndex + 1) % backgrounds.length;
    }
    changeBackground();
    setInterval(changeBackground, 5000);

    // Switch to signup
    function showSignup() {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("signupPage").style.display = "block";
    }

    // Switch to login
    function showLogin() {
        document.getElementById("signupPage").style.display = "none";
        document.getElementById("loginPage").style.display = "block";
    }

    // Signup validation
    async function validateSignup() {
        let email = document.getElementById("signupEmail").value.trim();
        let pass = document.getElementById("signupPassword").value.trim();
        let repass = document.getElementById("signupRePassword").value.trim();

        document.getElementById("signupEmailError").textContent = "";
        document.getElementById("signupPasswordError").textContent = "";
        document.getElementById("signupRePasswordError").textContent = "";

        if (pass !== repass) {
            document.getElementById("signupRePasswordError").textContent = "Passwords do not match.";
            return;
        }

        try {
            const res = await fetch("http://localhost:8081/signup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password: pass })
            });
            const data = await res.json();
            if (res.ok) {
                alert("Signup successful! You can now login.");
                showLogin();
            } else {
                document.getElementById("signupEmailError").textContent = data.error || "Signup failed.";
            }
        } catch (err) {
            alert("Server error. Make sure the backend is running.");
        }
    }

    // Login validation
    async function validateLogin() {
        let email = document.getElementById("loginEmail").value.trim();
        let pass = document.getElementById("loginPassword").value.trim();

        document.getElementById("loginEmailError").textContent = "";
        document.getElementById("loginPasswordError").textContent = "";

        try {
            const res = await fetch("http://localhost:8081/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password: pass })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem("userEmail", data.email);
                alert("Login successful!");
                window.location.href = "index.html";
            } else {
                document.getElementById("loginPasswordError").textContent = data.error || "Login failed.";
            }
        } catch (err) {
            alert("Server error. Make sure the backend is running.");
        }
    }
</script>
</body>
</html>
