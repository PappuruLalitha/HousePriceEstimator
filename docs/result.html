<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Estimated House Price</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; }
        .slideshow { position: fixed; width: 100vw; height: 100vh; z-index: -1; top: 0; left: 0; }
        .slide { 
            position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center;
            opacity: 0; transition: opacity 1s ease-in-out;
        }
        .slide.active { opacity: 1; z-index: 1; }
        .result-box { 
            background: rgba(255,255,255,0.85); padding: 2rem 3rem; border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; min-width: 320px;
        }
        .price { font-size: 2.5rem; color: #007bff; font-weight: bold; margin-top: 1rem; }
        .again-btn { margin-top: 2rem; display: inline-block; padding: 10px 24px; background: #007bff; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; text-decoration: none;}
        .again-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <!-- Background Slideshow -->
    <div class="slideshow">
        <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1560448204-e02f11c3d0e2');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1570129477492-45c003edd2be');"></div>
        <div class="slide" style="background-image: url('https://cdn-2.reimaginehome.ai/dev/media/Exterior-Sample-bdefaaf7-3f9c-415b-8e70-eb448b0d85ea.jpeg');"></div>
        <div class="slide" style="background-image: url('https://bonito.in/wp-content/uploads/2021/11/Blog-Detail-02-1.jpg');"></div>
        <div class="slide" style="background-image: url('https://www.orangetree.in/cdn/shop/articles/Living-and-dining_1_1_1100x_08a44e99-1855-4516-ab82-86bbc86b74a3.jpg?v=1722849622');"></div>
    </div>
    <div class="result-box">
        <h1>Your Estimated House Price</h1>
        <div class="price" id="price-output"></div>
        <a href="index.html" class="again-btn">Estimate Again</a>
    </div>
    <script>
        // Slideshow logic
        const slides = document.querySelectorAll('.slide');
        let idx = 0;
        setInterval(() => {
            slides[idx].classList.remove('active');
            idx = (idx + 1) % slides.length;
            slides[idx].classList.add('active');
        }, 5000);

        // Show price
        const price = localStorage.getItem("estimatedPrice");
        document.getElementById("price-output").textContent = price
            ? new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(price)
            : "No estimate found.";
    </script>
</body>
</html>
