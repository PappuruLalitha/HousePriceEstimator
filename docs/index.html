
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Price Estimator</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c")
                center/cover fixed;
    padding: 30px 15px;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 30px;
    background: rgba(255,255,255,0.93);
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.2);
}

h1 {
    text-align: center;
    color: #174a75;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 6px;
    background: #007BFF;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover { background: #0056b3; }

button:disabled {
    background: #888;
    cursor: wait;
}

#message {
    margin-top: 15px;
    text-align: center;
    color: red;
}

.user {
    text-align: right;
    color: #174a75;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="container">

    <p class="user" id="userEmail"></p>

    <h1>House Price Estimator</h1>
    <p>Enter your house details to calculate the estimated cost.</p>

    <form id="estimateForm">

        <label>Land Size (in cents)</label>
        <input type="number" id="landSize" min="0.1"
               step="0.1" required>

        <label>Number of Floors</label>
        <input type="number" id="numFloors" min="1"
               step="1" required>

        <label>Number of Bedrooms</label>
        <input type="number" id="bedrooms" min="0"
               step="1" required>

        <label>Number of Kitchens</label>
        <input type="number" id="kitchens" min="0"
               step="1" required>

        <label>Number of Bathrooms</label>
        <input type="number" id="bathrooms" min="0"
               step="1" required>

        <label>Elevation</label>
        <select id="elevation" required>
            <option value="No">No</option>
            <option value="Yes">Yes</option>
        </select>

        <label>Building Materials</label>
        <select id="materials" required>
            <option value="Standard">Standard</option>
            <option value="Premium">Premium</option>
        </select>

        <button type="submit" id="calculateButton">
            Calculate House Price
        </button>

    </form>

    <div id="message"></div>

</div>

<script>
const API_URL = "https://housepriceestimator-qhgh.onrender.com";

const userEmail = localStorage.getItem("userEmail");

document.getElementById("userEmail").textContent =
    userEmail ? "Welcome: " + userEmail : "House Price Estimator";

// If login is mandatory, uncomment these lines:
// if (!userEmail) {
//     window.location.replace("./LoginPage.html");
// }

document.getElementById("estimateForm").addEventListener("submit",
async function(event) {

    event.preventDefault();

    const button = document.getElementById("calculateButton");
    const message = document.getElementById("message");

    message.textContent = "";

    const landSize = Number(document.getElementById("landSize").value);
    const numFloors = Number(document.getElementById("numFloors").value);
    const bedrooms = Number(document.getElementById("bedrooms").value);
    const kitchens = Number(document.getElementById("kitchens").value);
    const bathrooms = Number(document.getElementById("bathrooms").value);
    const elevation = document.getElementById("elevation").value;
    const materials = document.getElementById("materials").value;

    if (
        landSize <= 0 || numFloors < 1 ||
        bedrooms < 0 || kitchens < 0 || bathrooms < 0
    ) {
        message.textContent = "Please enter valid house details.";
        return;
    }

    const requestData = {
        landSize,
        numFloors,
        bedrooms,
        kitchens,
        bathrooms,
        elevation,
        materials,
        userEmail: userEmail || ""
    };

    button.disabled = true;
    button.textContent = "Calculating...";
    message.textContent = "Please wait. Connecting to server...";

    try {
        const response = await fetch(`${API_URL}/calculate`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(requestData)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Calculation failed.");
        }

        // Read the total from the backend response.
        const estimatedPrice =
            data.estimatedPrice ??
            data.totalCost ??
            data.estimatedCost ??
            data.total ??
            data.price;

        if (estimatedPrice === undefined || !Number.isFinite(Number(estimatedPrice))) {
            throw new Error(
                "The backend response did not contain a recognised price field. Check the /calculate response."
            );
        }

        localStorage.setItem("estimatedPrice", estimatedPrice);

        window.location.assign("./result.html");

    } catch (error) {
        console.error("Calculation error:", error);
        message.textContent =
            error.message || "Unable to connect to the backend.";
    } finally {
        button.disabled = false;
        button.textContent = "Calculate House Price";
    }
});
</script>

</body>
</html>
