
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Portal</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        transition: background-image 1s ease-in-out;
    }

    .form-box {
        background: rgba(255, 255, 255, 0.9);
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
        width: 90%;
        max-width: 380px;
        text-align: center;
    }

    .form-box h2 {
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    button {
        background-color: #007BFF;
        color: white;
        padding: 12px;
        border: none;
        width: 100%;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
        font-size: 16px;
    }

    button:hover {
        background-color: #0056b3;
    }

    button:disabled {
        background-color: #999;
        cursor: not-allowed;
    }

    .error {
        color: red;
        font-size: 14px;
        margin-top: 5px;
    }

    .success {
        color: green;
        font-size: 14px;
        margin-top: 5px;
    }

    a {
        color: #007BFF;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    #signupPage {
        display: none;
    }
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="form-box" id="loginPage">

    <h2>House Portal Login</h2>

    <div id="loginMessage"></div>

    <input
        type="email"
        id="loginEmail"
        placeholder="Enter your Email"
        required
    >

    <div id="loginEmailError" class="error"></div>

    <input
        type="password"
        id="loginPassword"
        placeholder="Enter your Password"
        required
    >

    <div id="loginPasswordError" class="error"></div>

    <button id="loginButton" onclick="validateLogin()">
        Login
    </button>

    <p>
        Don't have an account?
        <a href="#" onclick="showSignup(); return false;">Sign up</a>
    </p>

</div>


<!-- SIGNUP PAGE -->
<div class="form-box" id="signupPage">

    <h2>Create Account</h2>

    <div id="signupMessage"></div>

    <input
        type="email"
        id="signupEmail"
        placeholder="Enter your Email"
        required
    >

    <div id="signupEmailError" class="error"></div>

    <input
        type="password"
        id="signupPassword"
        placeholder="Enter your Password"
        required
    >

    <div id="signupPasswordError" class="error"></div>

    <input
        type="password"
        id="signupRePassword"
        placeholder="Re-enter Password"
        required
    >

    <div id="signupRePasswordError" class="error"></div>

    <button id="signupButton" onclick="validateSignup()">
        Sign Up
    </button>

    <p>
        Already have an account?
        <a href="#" onclick="showLogin(); return false;">Login</a>
    </p>

</div>


<script>

// RENDER BACKEND URL
const API_URL = "https://housepriceestimator-qhgh.onrender.com";


// Background slideshow
const backgrounds = [
    "url('https://images.unsplash.com/photo-1560448204-e02f11c3d0e2')",
    "url('https://images.unsplash.com/photo-1570129477492-45c003edd2be')",
    "url('https://cdn-2.reimaginehome.ai/dev/media/Exterior-Sample-bdefaaf7-3f9c-415b-8e70-eb448b0d85ea.jpeg')"
];

let bgIndex = 0;

function changeBackground() {
    document.body.style.backgroundImage = backgrounds[bgIndex];
    bgIndex = (bgIndex + 1) % backgrounds.length;
}

changeBackground();
setInterval(changeBackground, 5000);


// Show Signup Page
function showSignup() {

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("signupPage").style.display = "block";

}


// Show Login Page
function showLogin() {

    document.getElementById("signupPage").style.display = "none";
    document.getElementById("loginPage").style.display = "block";

}


// Clear messages
function clearSignupErrors() {

    document.getElementById("signupEmailError").textContent = "";
    document.getElementById("signupPasswordError").textContent = "";
    document.getElementById("signupRePasswordError").textContent = "";
    document.getElementById("signupMessage").textContent = "";

}

function clearLoginErrors() {

    document.getElementById("loginEmailError").textContent = "";
    document.getElementById("loginPasswordError").textContent = "";
    document.getElementById("loginMessage").textContent = "";

}


// SIGNUP FUNCTION
async function validateSignup() {

    clearSignupErrors();

    const email = document.getElementById("signupEmail").value.trim();
    const pass = document.getElementById("signupPassword").value.trim();
    const repass = document.getElementById("signupRePassword").value.trim();

    const button = document.getElementById("signupButton");

    if (!email || !pass || !repass) {
        document.getElementById("signupMessage").textContent =
            "Please fill in all fields.";
        return;
    }

    if (pass !== repass) {
        document.getElementById("signupRePasswordError").textContent =
            "Passwords do not match.";
        return;
    }

    button.disabled = true;
    button.textContent = "Signing Up...";

    try {

        const response = await fetch(`${API_URL}/signup`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: pass
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Signup failed.");
        }

        document.getElementById("signupMessage").className = "success";
        document.getElementById("signupMessage").textContent =
            "Signup successful! Please login.";

        document.getElementById("signupEmail").value = "";
        document.getElementById("signupPassword").value = "";
        document.getElementById("signupRePassword").value = "";

        setTimeout(() => {
            showLogin();
            document.getElementById("loginEmail").value = email;
            document.getElementById("loginMessage").textContent =
                "Please login with your details.";
            document.getElementById("loginMessage").className = "success";
        }, 1200);

    } catch (error) {

        console.error("Signup Error:", error);

        document.getElementById("signupMessage").className = "error";
        document.getElementById("signupMessage").textContent =
            error.message || "Unable to connect to server.";

    } finally {

        button.disabled = false;
        button.textContent = "Sign Up";

    }

}


// LOGIN FUNCTION
async function validateLogin() {

    clearLoginErrors();

    const email = document.getElementById("loginEmail").value.trim();
    const pass = document.getElementById("loginPassword").value.trim();

    const button = document.getElementById("loginButton");

    if (!email || !pass) {
        document.getElementById("loginMessage").textContent =
            "Please enter email and password.";
        document.getElementById("loginMessage").className = "error";
        return;
    }

    button.disabled = true;
    button.textContent = "Logging In...";

    try {

        const response = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: pass
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Login failed.");
        }

        // Save logged-in user's email
        localStorage.setItem("userEmail", data.email || email);

        alert("Login successful!");

        // Open house price estimator
        window.location.href = "index.html";

    } catch (error) {

        console.error("Login Error:", error);

        document.getElementById("loginMessage").className = "error";
        document.getElementById("loginMessage").textContent =
            error.message || "Unable to connect to server.";

    } finally {

        button.disabled = false;
        button.textContent = "Login";

    }

}

</script>

</body>
</html>
