
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Portal Login</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background-size: cover;
    background-position: center;
}

.form-box {
    background: rgba(255,255,255,0.92);
    padding: 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #007BFF;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

button:disabled {
    background: #999;
}

a {
    color: #007BFF;
    text-decoration: none;
}

.error { color: red; }
.success { color: green; }

#signupPage { display: none; }
</style>
</head>

<body>

<div class="form-box" id="loginPage">
    <h2>House Portal Login</h2>
    <div id="loginMessage"></div>

    <input type="email" id="loginEmail"
           placeholder="Enter your Email">

    <input type="password" id="loginPassword"
           placeholder="Enter your Password">

    <button id="loginButton" onclick="validateLogin()">Login</button>

    <p>Don't have an account?
       <a href="#" onclick="showSignup(); return false;">Sign up</a>
    </p>
</div>

<div class="form-box" id="signupPage">
    <h2>Create Account</h2>
    <div id="signupMessage"></div>

    <input type="email" id="signupEmail"
           placeholder="Enter your Email">

    <input type="password" id="signupPassword"
           placeholder="Enter your Password">

    <input type="password" id="signupRePassword"
           placeholder="Re-enter Password">

    <button id="signupButton" onclick="validateSignup()">Sign Up</button>

    <p>Already have an account?
       <a href="#" onclick="showLogin(); return false;">Login</a>
    </p>
</div>

<script>
const API_URL = "https://housepriceestimator-qhgh.onrender.com";

const HOME_URL =
"https://pappurulalitha.github.io/HousePriceEstimator/index.html";

const backgrounds = [
    "url('https://images.unsplash.com/photo-1560448204-e02f11c3d0e2')",
    "url('https://images.unsplash.com/photo-1570129477492-45c003edd2be')",
    "url('https://cdn-2.reimaginehome.ai/dev/media/Exterior-Sample-bdefaaf7-3f9c-415b-8e70-eb448b0d85ea.jpeg')"
];

let bgIndex = 0;

function changeBackground() {
    document.body.style.backgroundImage = backgrounds[bgIndex];
    bgIndex = (bgIndex + 1) % backgrounds.length;
}

changeBackground();
setInterval(changeBackground, 5000);

function showSignup() {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("signupPage").style.display = "block";
    clearMessages();
}

function showLogin() {
    document.getElementById("signupPage").style.display = "none";
    document.getElementById("loginPage").style.display = "block";
    clearMessages();
}

function clearMessages() {
    document.getElementById("loginMessage").textContent = "";
    document.getElementById("signupMessage").textContent = "";
}

async function validateSignup() {
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value.trim();
    const confirmPassword =
        document.getElementById("signupRePassword").value.trim();

    const message = document.getElementById("signupMessage");
    const button = document.getElementById("signupButton");

    message.className = "";
    message.textContent = "";

    if (!email || !password || !confirmPassword) {
        message.className = "error";
        message.textContent = "Please fill in all fields.";
        return;
    }

    if (password !== confirmPassword) {
        message.className = "error";
        message.textContent = "Passwords do not match.";
        return;
    }

    button.disabled = true;
    button.textContent = "Signing Up...";

    try {
        const response = await fetch(`${API_URL}/signup`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Signup failed.");
        }

        message.className = "success";
        message.textContent = "Signup successful! Please login.";

        document.getElementById("signupPassword").value = "";
        document.getElementById("signupRePassword").value = "";

        setTimeout(() => {
            showLogin();
            document.getElementById("loginEmail").value = email;
        }, 1200);

    } catch (error) {
        message.className = "error";
        message.textContent = error.message;
    } finally {
        button.disabled = false;
        button.textContent = "Sign Up";
    }
}

async function validateLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value.trim();

    const message = document.getElementById("loginMessage");
    const button = document.getElementById("loginButton");

    message.className = "";
    message.textContent = "";

    if (!email || !password) {
        message.className = "error";
        message.textContent = "Please enter email and password.";
        return;
    }

    button.disabled = true;
    button.textContent = "Logging In...";

    try {
        const response = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Login failed.");
        }

        localStorage.setItem("userEmail", data.email || email);

        // Open the actual estimator page
        window.location.assign(HOME_URL);

    } catch (error) {
        message.className = "error";
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Login";
    }
}
</script>

</body>
</html>
