<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House Price Estimator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }

        /* Background Slideshow */
        .slideshow { position: fixed; width: 100%; height: 100%; z-index: -1; top: 0; left: 0; }
        .slide { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background-size: cover; 
            background-position: center; 
            opacity: 0; 
            transition: opacity 1s ease-in-out; 
        }
        .slide.active { opacity: 1; z-index: 1; }

        /* Form and Result */
        .main-content { position: relative; z-index: 2; padding: 2rem; min-height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .form-container, .result-container {
            width: 90%; max-width: 500px; padding: 2rem; background: rgba(255, 255, 255, 0.7);
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); margin-top: 2rem;
        }
        .result-container { text-align: center; display: none; }
        h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.8rem; color: #333; }
        label { display: block; margin: 0.8rem 0 0.3rem; color: #333; font-weight: bold; }
        input[type="number"], input[type="text"], input[type="file"] {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 0.5rem;
        }
        .btn { display: block; width: 100%; margin-top: 1.5rem; padding: 10px; background: #007bff; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .btn:hover { background-color: #0056b3; }

        /* Material buttons */
        .material-btns { margin-top: 1rem; display: flex; flex-wrap: wrap; gap: 10px; }
        .material-btn {
            flex: 1 1 30%; padding: 10px; background: #28a745; color: white; border: none;
            border-radius: 6px; cursor: pointer; font-size: 14px; text-align: center;
        }
        .material-btn.selected { background: #155d27; }
        #price-output { font-size: 2.5rem; font-weight: bold; color: #007bff; margin-top: 1.5rem; }
    </style>
</head>
<body>

<!-- Background Slideshow -->
<div class="slideshow">
    <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c');"></div>
    <div class="slide" style="background-image: url('https://t4.ftcdn.net/jpg/15/32/91/27/360_F_1532912757_TXavvamqWDdKF4534vxdKtlwEmW2hPzP.jpg');"></div>
    <div class="slide" style="background-image: url('https://d2fryjlmubyuuh.cloudfront.net/wp-content/uploads/2024/07/07192037/AI-kate-middleton-bathroom-jpg.webp');"></div>
    <div class="slide" style="background-image: url('https://bonito.in/wp-content/uploads/2021/11/Blog-Detail-02-1.jpg');"></div>
    <div class="slide" style="background-image: url('https://www.orangetree.in/cdn/shop/articles/Living-and-dining_1_1_1100x_08a44e99-1855-4516-ab82-86bbc86b74a3.jpg?v=1722849622');"></div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="form-container">
        <h1> House Price Estimator</h1>
        <form id="price-form">

            <label>Land Size (in cents):</label>
            <input type="number" name="land_size" placeholder="e.g., 5" required />

            <label>Number of Floors:</label>
            <input type="number" name="num_floors" placeholder="e.g., 2" required />

            <label>Bedrooms per Floor:</label>
            <input type="number" name="bedrooms" placeholder="e.g., 2" required />

            <label>Kitchen :</label>
            <input type="number" name="kitchens" placeholder="e.g., 1" required />

            <label>Bathrooms per Floor:</label>
            <input type="number" name="bathrooms" placeholder="e.g., 2" required />

            <label>Select Materials:</label>
            <div class="material-btns">
                <button type="button" class="material-btn" data-name="Bricks">Bricks</button>
                <button type="button" class="material-btn" data-name="Cement">Cement</button>
                <button type="button" class="material-btn" data-name="Sand">Sand</button>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="elevation" name="elevation" value="true" />
                <label for="elevation">Include Elevation Cost (₹1,00,000)</label>
            </div>

            <button type="submit" class="btn">Estimate Price</button>
        </form>
    </div>

    <div class="result-container" id="result-container">
        <h2>Estimated Price</h2>
        <p>Based on your specifications, the estimated cost is:</p>
        <div id="price-output"></div>
    </div>
</div>

<script>
// Toggle material buttons
document.querySelectorAll(".material-btn").forEach(btn => {
  btn.addEventListener("click", () => btn.classList.toggle("selected"));
});

// Handle form submit
const form = document.getElementById("price-form");
const priceOut = document.getElementById("price-output");
const resultWrap = document.getElementById("result-container");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const landSize   = parseFloat(form.land_size.value || "0");
  const numFloors  = parseInt(form.num_floors.value || "1");
  const bedrooms   = parseInt(form.bedrooms.value || "0");
  const kitchens   = parseInt(form.kitchens.value || "0");
  const bathrooms  = parseInt(form.bathrooms.value || "0");
  const elevation  = document.getElementById("elevation").checked;

  const materials = Array.from(document.querySelectorAll(".material-btn.selected"))
    .map(b => b.dataset.name || b.innerText.trim());

  try {
    const res = await fetch("/api/calculate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        landSize, numFloors, bedrooms, kitchens, bathrooms, elevation, materials
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Server error");
    localStorage.setItem("estimatedPrice", data.price);
    window.location.href = "result.html";
    priceOut.textContent = new Intl.NumberFormat('en-IN', {
      style: 'currency', currency: 'INR', maximumFractionDigits: 0
    }).format(data.price);

    resultWrap.style.display = 'block';
  } catch (err) {
    console.error(err);
    priceOut.textContent = "Could not calculate. Check server & console.";
    resultWrap.style.display = 'block';
  }
});
const slides = document.querySelectorAll('.slide');
let currentSlide = 0;
setInterval(() => {
    slides[currentSlide].classList.remove('active');
    currentSlide = (currentSlide + 1) % slides.length;
    slides[currentSlide].classList.add('active');
}, 5000);
</script>


</body>
</html>
